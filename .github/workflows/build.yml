name: Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Если секрета с ключом нет, создаём новый ключ (только для первого раза)
      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/ks" out
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ks/tiktrim.jks"
            echo "Using keystore from secrets"
          else
            echo "NEW_KEYSTORE=1" >> "$GITHUB_ENV"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/ks/tiktrim.jks" \
              -alias tiktrim -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass tiktrim123456 -keypass tiktrim123456 \
              -dname "CN=MarkusVidan"
            cp "$RUNNER_TEMP/ks/tiktrim.jks" out/tiktrim.jks
            base64 -w0 "$RUNNER_TEMP/ks/tiktrim.jks" > out/KEYSTORE_BASE64.txt
          fi

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ks/tiktrim.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'tiktrim123456' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'tiktrim' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'tiktrim123456' }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk out/TikTrim-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TikTrim-release
          path: out/
