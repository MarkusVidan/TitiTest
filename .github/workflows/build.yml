name: Release APK

name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK уже установлен на сервере, только принимаем лицензии
      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Распаковываем проект из zip, лежащего в корне репозитория
      - name: Unpack project
        run: |
          ZIP=$(ls *.zip | head -1)
          echo "Using $ZIP"
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/src"
          PROJ=$(dirname "$(find "$RUNNER_TEMP/src" -name settings.gradle.kts | head -1)")
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/out"

      # Если секрета с ключом нет, создаём новый ключ (только для первого раза)
      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/ks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ks/tiktrim.jks"
            echo "Using keystore from secrets"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/ks/tiktrim.jks" \
              -alias tiktrim -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass tiktrim123456 -keypass tiktrim123456 \
              -dname "CN=MarkusVidan"
            cp "$RUNNER_TEMP/ks/tiktrim.jks" "$GITHUB_WORKSPACE/out/tiktrim.jks"
            base64 -w0 "$RUNNER_TEMP/ks/tiktrim.jks" > "$GITHUB_WORKSPACE/out/KEYSTORE_BASE64.txt"
          fi

      - name: Build release APK
        working-directory: ${{ env.PROJ }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ks/tiktrim.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'tiktrim123456' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'tiktrim' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'tiktrim123456' }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Collect APK
        run: cp "$PROJ/app/build/outputs/apk/release/app-release.apk" out/TikTrim-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TikTrim-release
          path: out/

      # Публикуем релиз: приложение берёт обновления отсюда
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' "$PROJ/app/build.gradle.kts")
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$PROJ/app/build.gradle.kts")
          TAG="build-$CODE"
          awk 'BEGIN{RS=""} NR==1{print; exit}' "$PROJ/app/src/main/assets/changelog.txt" > notes.txt
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" out/TikTrim-release.apk \
            --title "TikTrim $NAME" \
            --notes-file notes.txt
